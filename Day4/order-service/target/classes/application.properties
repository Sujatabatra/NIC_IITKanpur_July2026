# ==========================================
# Application Configuration
# ==========================================

spring.application.name=order-service

spring.config.import=optional:configserver:http://localhost:8888

server.port=8086

# ==========================================
# MySQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sujata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update

# ==========================================
# Logging
# ==========================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================
# Eureka Client
# ==========================
#telling Product Service where Eureka Server is running.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#When Product Service starts, it registers automatically.
eureka.client.register-with-eureka=true
#Allows Product Service to discover other services late
eureka.client.fetch-registry=true
#Registers the service using its IP address.
eureka.instance.prefer-ip-address=true


#############################################################
# ACTUATOR
#############################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#############################################################
# RESILIENCE4J CIRCUIT BREAKER - PRODUCT SERVICE
#############################################################

# Number of recent calls to consider while calculating the failure rate.
# Here, the circuit breaker always looks at the last 10 calls. 
#default : 100
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

# Percentage of failed calls that will trip (open) the circuit.
# If 50% or more of the last 10 calls fail, the circuit opens.
#default : 50
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

# Once the circuit is opened, no requests are sent to Product Service
# for the next 10 seconds.
#default : 60s
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s

#After the 10-second wait, allow only 5 test requests to determine
# whether the Product Service has recovered.
#default : 10
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=5

# Automatically move the circuit from OPEN to HALF_OPEN after
# the configured wait duration (10 seconds).
# If false, the transition happens only when a new request arrives.
#default : false
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true

#############################################################
# RESILIENCE4J CIRCUIT BREAKER - CUSTOMER SERVICE
#############################################################

resilience4j.circuitbreaker.instances.customerService.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.customerService.automatic-transition-from-open-to-half-open-enabled=true


#############################################################
# RESILIENCE4J CIRCUIT BREAKER - INVENTORY SERVICE
#############################################################

resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.inventoryService.automatic-transition-from-open-to-half-open-enabled=true
