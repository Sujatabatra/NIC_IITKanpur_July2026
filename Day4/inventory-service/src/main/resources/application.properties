spring.application.name=inventory-service

spring.config.import=optional:configserver:http://localhost:8888
#############################################################
# SERVER
#############################################################

server.port=8087

#############################################################
# MYSQL
#############################################################

spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sujata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#############################################################
# JPA
#############################################################

spring.jpa.hibernate.ddl-auto=update

#############################################################
# EUREKA
#############################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#############################################################
# ACTUATOR
#############################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#############################################################
# LOGGING
#############################################################

logging.level.root=INFO
logging.level.com.sujata.inventoryservice=DEBUG

#############################################################
# RESILIENCE4J CIRCUIT BREAKER - PRODUCT SERVICE
#############################################################

# Number of recent calls to consider while calculating the failure rate.
# Here, the circuit breaker always looks at the last 10 calls. 
#default : 100
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

# Percentage of failed calls that will trip (open) the circuit.
# If 50% or more of the last 10 calls fail, the circuit opens.
#default : 50
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

# Once the circuit is opened, no requests are sent to Product Service
# for the next 10 seconds.
#default : 60s
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s

#After the 10-second wait, allow only 5 test requests to determine
# whether the Product Service has recovered.
#default : 10
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=5

# Automatically move the circuit from OPEN to HALF_OPEN after
# the configured wait duration (10 seconds).
# If false, the transition happens only when a new request arrives.
#default : false
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true

