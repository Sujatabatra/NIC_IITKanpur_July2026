#############################################################
# SERVER
#############################################################

server.port=8087

#############################################################
# MYSQL
#############################################################

spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=sujata

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#############################################################
# JPA
#############################################################

spring.jpa.hibernate.ddl-auto=update


#############################################################
# EUREKA
#############################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

#############################################################
# KAFKA
#############################################################

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=inventory-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=com.sujata.inventoryservice.kafka.OrderEvent


#############################################################
# TOPIC
#############################################################

app.kafka.topic.order-created=order-created

#############################################################
# ACTUATOR
#############################################################

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

#############################################################
# LOGGING
#############################################################

logging.level.root=INFO

logging.level.com.sujata.inventoryservice=DEBUG

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE
