#############################################################
# APPLICATION
#############################################################

spring.application.name=NOTIFICATION-SERVICE-TEST

#############################################################
# MYSQL TEST DATABASE
#############################################################

# Separate MySQL database used only for integration tests
spring.datasource.url=jdbc:mysql://localhost:3306/test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=sujata

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#############################################################
# JPA / HIBERNATE
#############################################################

# Create tables when tests start and remove them when context closes
spring.jpa.hibernate.ddl-auto=create-drop

# Display SQL generated by Hibernate
spring.jpa.show-sql=true

# Format generated SQL
spring.jpa.properties.hibernate.format_sql=true

# Recommended MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#############################################################
# CONFIG SERVER
#############################################################

# Prevent tests from contacting Config Server
spring.cloud.config.enabled=false

spring.cloud.config.fail-fast=false

#############################################################
# EUREKA
#############################################################

# Prevent test application registration with Eureka
eureka.client.enabled=false

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

#############################################################
# KAFKA
#############################################################

# Prevent Kafka listeners from starting during these tests
spring.kafka.listener.auto-startup=false

# Placeholder required by @KafkaListener
app.kafka.topic.order-created=order-created-test

# Provide a value in case Kafka auto-configuration requires it
spring.kafka.bootstrap-servers=localhost:9092