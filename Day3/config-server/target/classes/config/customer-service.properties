spring.application.name=customer-service

server.port=8084

# ==========================================
# MySQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/customerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sujata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update

#spring.jpa.open-in-view=false

#spring.jpa.defer-datasource-initialization=true

# ==========================================
# Logging
# ==========================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================
# Eureka Client
# ==========================
#telling Product Service where Eureka Server is running.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#When Product Service starts, it registers automatically.
eureka.client.register-with-eureka=true
#Allows Product Service to discover other services late
eureka.client.fetch-registry=true
#Registers the service using its IP address.
eureka.instance.prefer-ip-address=true